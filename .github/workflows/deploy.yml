# Publishes the demo page (pnpm build:demo → dist-demo) to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The page has no server: visitors connect their own model endpoint and key in the browser.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A demo that fails its checks is not published.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:demo
      # Last line of defence: no local config is tracked, and the page holds nothing that could
      # reach a developer's .env.local (the dev-server proxy and its endpoints are dev-only).
      - name: No local config in the published page
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?\.local$'; then echo "A .env*.local file is committed" >&2; exit 1; fi
          if grep -rlE '\.env\.local|/api/(ai|status)' dist-demo; then echo "The page refers to the dev server or .env.local" >&2; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
